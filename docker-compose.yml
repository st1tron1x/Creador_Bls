services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bl-platform-app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    ports:
      - "8090:8000"          # host:contenedor -> http://localhost:8090
    depends_on:
      - db
    networks:
      - bl-platform-net
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db             # nombre del servicio, Docker lo resuelve internamente
      DB_PORT: 5432
      DB_DATABASE: bl_platform
      DB_USERNAME: bl_platform_user
      DB_PASSWORD: change_me   # cámbialo, y también en tu .env local

  db:
    image: postgres:16-alpine   # ya la tienes descargada, Docker reutiliza la imagen
    container_name: bl-platform-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: bl_platform
      POSTGRES_USER: bl_platform_user
      POSTGRES_PASSWORD: change_me
    ports:
      - "5433:5432"           # host:contenedor -> distinto al 5432 para no chocar con otra DB local
    volumes:
      - bl_platform_db_data:/var/lib/postgresql/data
    networks:
      - bl-platform-net

networks:
  bl-platform-net:
    name: bl-platform-net       # red exclusiva de este proyecto

volumes:
  bl_platform_db_data:
    name: bl_platform_db_data   # volumen exclusivo, no toca los datos de tyc-plataforma-app
